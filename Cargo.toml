[package]
name = "actix-web-sqlx-starter"
version = "0.1.0"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "A starter for a backend in Actix Web"
readme = "README.md"
repository = "https://github.com/crustyrustacean/actix-web-starter.git"
license = "MIT"
publish = false

[[bin]]
name = "actix-web-sqlx-starter"
path = "src/bin/main.rs"

[dependencies]
actix-web = "4.13.0"
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
config = { version = "0.15.19", default-features = false, features = ["yaml"] }
log = "0.4"
reqwest = { version = "0.13.2", features = [ "json" ] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.149"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.19"
tracing-actix-web = "0.7"
tracing-log = "0.2.0"
tracing-bunyan-formatter = "0.3.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

